<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Letter of Support Builder</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23090909%22/%3E%3Crect x=%224%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%23344982%22/%3E%3Crect x=%2210%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%232F6F9E%22/%3E%3Crect x=%2216%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%232CA5B8%22/%3E%3Crect x=%2222%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%23AB5C95%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="kit.css">
<script src="theme.js"></script></head><body>
<noscript><p style="padding:24px;font:16px sans-serif">This builder needs JavaScript. Turn it on and reload.</p></noscript>
<script src="kit.js"></script>
<script>
/* Letter of support: a clean letter on Estus letterhead. Details at the top, your text, your signature.
   Engine: kit.js. */
EstusKit.start(function(K){
const {esc,str,paras,parseD,fmtD,longD,today,addMonths,ageAt,F,say,OT,FINISH,row,pushParas}=K;
function dear(){const t=K.S.to;return str(t.dear)?"Dear "+str(t.dear)+",":str(t.name)?"Dear "+str(t.name)+",":"To whom it may concern,"}

return{
id:"letter",name:"Letter of Support",h1:"Letter of support",newLabel:"Start a new letter",newToast:"New letter started",
exampleNote:"Example letter for a fictional person. Your edits save in this browser only.",
docTitle:()=>"Letter of Support",
docSub:()=>"Occupational therapy. Confidential.",
blank:()=>({client:{firstName:"",preferred:"",surname:"",dob:"",ndis:""},to:{name:"",org:"",dear:""},body:{text:""}}),
example(){const t=today();return{
  client:{firstName:"Noah",preferred:"",surname:"Patel",dob:addMonths(t,-207),ndis:"430000001"},
  to:{name:"NDIA Planner",org:"National Disability Insurance Agency",dear:"Planner"},
  body:{text:"I am writing in support of Noah's request for a review of his NDIS plan. I am an occupational therapist at Estus Health and have worked with Noah since September 2025, across 31 sessions.\nNoah finishes Year 12 this term and starts a supported traineeship in February, three days a week. His current plan was written for a school year and does not fund supports for work or travel.\nNoah has not yet caught public transport on his own. Crowds, noise and changes to services lead to shutdowns, and his dad, who drives him now, cannot do so around work hours. His energy also drops sharply after four or five hours in a busy setting.\nI recommend 40 hours of occupational therapy over 12 months, and 6 hours a week of support worker time for travel training for 6 months, then review. Together these will build his routines and independent travel to work, so paid support can fade over time.\nWithout these supports, Noah is at real risk of losing his traineeship in its first months."},
  meta:{date:t},ot:{ahpra:"OCC0001234567"}}},
secOf:p=>{const t=p.split(".")[0];return({client:"details",to:"details",body:"letter"})[t]||null},
sections:[
{g:"Letter",id:"details",nav:"Details",title:"Details",lead:"Who it is about, who it goes to, and the date.",render:()=>`<div class="form">
  <div class="grid3">${F("client.firstName","First name")}${F("client.surname","Surname")}${F("client.dob","Date of birth",{type:"date"})}</div>
  <div class="grid3">${F("client.ndis","NDIS number",{ph:"Optional",num:true})}${F("to.name","To",{ph:"NDIA Planner"})}${F("to.org","Organisation",{ph:"Optional"})}</div>
  <div class="grid2">${F("to.dear","Greeting",{ph:"Planner",hint:"Fills “Dear …”. Empty uses the To name, or “To whom it may concern”."})}${F("meta.date","Date",{type:"date"})}</div>
  ${OT()}</div>`},
{g:"Letter",id:"letter",nav:"Letter",title:"Letter",lead:"Write it as you would in Word. Each new line is a new paragraph. **Bold** works.",render:()=>`<div class="form">
  ${say("dear-say")}
  ${F("body.text","Letter",{type:"area",rows:16,ph:"What they are asking for and how you know them.\nWhat is hard, with examples.\nWhat you recommend and why.\nWhat happens without it."})}
  ${FINISH()}</div>`}
],
live(){const d=document.getElementById("dear-say");if(d)d.textContent=dear()},
checks(add,need){
  need("details","client.firstName","First name");need("details","client.surname","Surname");
  need("details","meta.date","Date");need("details","ot.name","Your name");need("details","ot.ahpra","AHPRA number");
  need("letter","body.text","The letter")},
build(){const s=K.S,B=[],c=s.client,t=s.to,info=[];
  const to=[str(t.name),str(t.org)].filter(Boolean).join(", ");if(to)info.push(row("To",to));
  info.push(row("Regarding",K.full()?[{p:K.full()}]:[{gap:"Name"}]));
  if(parseD(c.dob))info.push(row("Date of birth",fmtD(c.dob)));
  if(str(c.ndis))info.push(row("NDIS number",c.ndis));
  info.push(row("Date",parseD(s.meta.date)?[{p:longD(s.meta.date)}]:[{gap:"Date"}]));
  B.push({t:"tbl",w:[30,70],rows:info});
  B.push({t:"p",text:dear()});
  pushParas(B,s.body.text,"The letter");
  B.push({t:"sign"});
  return B}
}});
</script>
</body></html>
