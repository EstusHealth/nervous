<head>

<style id="appstyle">
:root{
  /* Layout: builder controls on the left, sticky prompt on the right; stacked with a bottom copy bar on phones. */
  --bg:#F3F2EF;--surface:#FBFAF8;--sunk:#ECEAE6;--ink:#0E1014;--muted:#65676E;--line:#D3D1CC;
  --accent:#344982;--accent-ink:#FBFAF8;--hi:#F1E1EC;--hi-ink:#5E2A4F;--danger:#B23A3A;--ok:#2E7D4F;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--ink:#ECEEF1;--muted:#9BA1AB;--line:#2C323C;
  --accent:#8299DA;--accent-ink:#0F1216;--hi:#33202E;--hi-ink:#F0C6E3;--danger:#EC7B7B;--ok:#5FC38A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--ink:#ECEEF1;--muted:#9BA1AB;--line:#2C323C;
  --accent:#8299DA;--accent-ink:#0F1216;--hi:#33202E;--hi-ink:#F0C6E3;--danger:#EC7B7B;--ok:#5FC38A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:12px}
.mark{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;color:var(--ink)}
.mark svg{flex:none}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tag{font-size:13px;color:var(--muted);margin:0}
.status{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.shared::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%}
.tabs a{padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{font:500 11px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:4px;font-variant-numeric:tabular-nums}
main{padding:20px 16px 120px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;line-height:1.2;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi-ink)}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;display:inline-grid;place-items:center;font-size:15px;padding:0;cursor:pointer;color:var(--ink)}
.icon:disabled{opacity:.35;cursor:default}

label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input:not([type=file]):not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;line-height:1.45}

.build{display:grid;gap:20px}
.controls{display:grid;gap:16px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:18px;min-width:0}
.sec>*,.group{min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec-h .n{font:500 12px var(--mono);color:var(--accent)}
.sec-h h2{font-size:17px;font-weight:700}
.g-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hint{text-transform:none;letter-spacing:0;font-weight:400}
.g-title a{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;line-height:1.3;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi-ink);font-weight:600}
.g-detail{margin:8px 0 0;font-size:13px;color:var(--muted);max-width:68ch;white-space:pre-line}
.g-detail:empty{display:none}

.out{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.out-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.out-h h2{font-size:17px}
.wc{margin-left:auto;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
#prompt{margin:0;padding:16px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto;flex:1;background:var(--sunk);min-height:200px}
.out-a{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mobilebar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:15}
.mobilebar .btn{flex:1}
@media (min-width:980px){
  .build{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .out{position:sticky;top:112px;max-height:calc(100vh - 130px)}
  .mobilebar{display:none}
}

.strip{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.sthumb{position:relative;border:2px solid transparent;border-radius:10px;padding:2px;background:none;text-align:left;display:grid;gap:4px;align-content:start;cursor:pointer;color:var(--ink)}
.sthumb:hover{border-color:var(--line)}
.sthumb[aria-pressed="true"]{border-color:#AB5C95}
.slabel{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px 2px}
.badge{position:absolute;top:8px;left:8px;background:#AB5C95;color:#fff;font:600 12px/1 var(--mono);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.th{position:relative;display:block;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:linear-gradient(165deg,hsl(var(--h) 40% 62%),hsl(calc(var(--h) + 35) 45% 32%));color:#fff;border-color:transparent}
.phl{position:absolute;left:8px;bottom:8px;right:8px;font:700 11px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em}
.ex{position:absolute;top:6px;right:6px;font-size:10px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:4px}
.th.mini{width:34px;flex:none;border-radius:5px}
.th.mini .ex,.th.mini .phl{display:none}
.picked{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.picked li{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.num{font:600 12px var(--mono);min-width:18px;text-align:center;color:var(--muted)}
.pname{flex:1;min-width:0;font-size:14px;line-height:1.3}
.pbtns{display:flex;gap:4px}
.empty{font-size:13px;color:var(--muted);margin:8px 0 0}
.startbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}

.page-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:16px}
.page-h h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%;max-width:68ch;order:3}
.page-h .btn{margin-left:auto}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:16px}
@media (min-width:640px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card-media{border:0;padding:0;background:none;display:block;cursor:pointer;width:100%}
.card-media .th{border-radius:0;border:0;aspect-ratio:4/5}
.card-b{padding:10px 12px;display:grid;gap:6px;flex:1;align-content:start}
.card h3{font:600 14px/1.3 var(--body)}
.meta{font-size:12px;color:var(--muted);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.card-a{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.card-a .btn{flex:1 1 auto;padding:6px 8px;font-size:13px;white-space:nowrap}

.rec-list{display:grid;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.rec>div:first-child{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.rec h3{font-size:16px}
.rec-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.panel summary{cursor:pointer;font:700 16px var(--display);display:flex;gap:10px;align-items:baseline}
.panel summary span{font:400 13px var(--body);color:var(--muted)}
.panel h3{font-size:16px;margin-bottom:4px}
.sub{margin:0 0 10px;font-size:13px;color:var(--muted);max-width:68ch}
.rows{display:grid;gap:8px;margin:12px 0}
.lrow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.lrow textarea{grid-column:1/-1}
@media (min-width:760px){.lrow{grid-template-columns:220px 1fr auto;align-items:start}.lrow textarea{grid-column:auto}}
.lrow input,.lrow textarea{background:var(--surface)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);display:none;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:25}
.savebar.show{display:flex}
.savebar span{flex:1}

.overlay{position:fixed;inset:0;background:rgba(8,12,16,.6);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(640px,100%);padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h2{font-size:20px}
.drop{display:flex;gap:14px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:12px}
.drop.over{border-color:var(--accent)}
.drop-prev{width:84px;flex:none}
.drop-text{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.drop-text strong{color:var(--ink);font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .wide{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.err{color:var(--danger);font-size:13px;margin:0}
.err:empty{display:none}
.modal-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.json{font:12px/1.5 var(--mono);min-height:240px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.sthumb{transition:background-color .12s,border-color .12s}}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid currentColor;line-height:1.4}
.pill.ok{color:var(--ok)}
.pill.warn{color:var(--danger)}
.chips.sm .chip{padding:4px 10px;font-size:13px}
.fname{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fname code{font:13px var(--mono);word-break:break-all;flex:1;min-width:0}
.guide{display:grid;gap:12px;max-width:920px}
.guide .panel{margin:0}
.steps{margin:0;padding-left:22px;display:grid;gap:12px;max-width:72ch}
.steps b{display:block}
.steps code,.sub code{font:12px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.tax{width:100%;border-collapse:collapse;font-size:14px}
.tax th,.tax td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tax th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tax td:first-child{white-space:nowrap}
.tax code{font:12px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.tblwrap{overflow-x:auto}
.req{color:var(--danger);text-transform:none;letter-spacing:0;font-weight:600}
.missing{font-size:12px;color:var(--danger);margin:0}
.qrow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.qrow .pname{display:grid;gap:2px}
.modal .g-title{margin-bottom:6px}

.ehub{background:#090909;color:#FBFAF8;border-bottom:1px solid #2C323C;position:relative;z-index:21;padding-top:env(safe-area-inset-top,0px)}

.ehub-home{display:flex;align-items:center;gap:12px;min-height:36px}
.ehub-bands{display:flex;width:56px;height:5px;flex:none}.ehub-bands i{flex:1}

.ehub-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehub-btn{font:600 12px/1 "Barlow Semi Condensed","Arial Narrow",sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid #3A3F48;background:none;color:#FBFAF8;padding:9px 12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:8px}

@media (max-width:520px){.ehub-sep{display:none}}
</style>

  var c=id?clipById(id):null, pending=null, src=c||{}, req=' <span class="req">required</span>';
  var html='<h2>'+(c?'Tag clip':'Add a B-roll clip')+'</h2><p class="sub">Tag it by the <a href="#guide" id="cf-guide">Tagging guide</a>. A clip counts as complete only when every required field is filled. You can save part way and finish later.</p>'+
  '<div class="drop" id="drop"><div class="drop-prev" id="dropPrev">'+(c?thumb(c):'<span class="th"></span>')+'</div><div class="drop-text"><strong>Screenshot of the scene'+req+'</strong><span>Take it about 1 second in. Choose an image, drop one here, or paste it.</span><span><label class="btn" for="cf-file">Choose image</label></span><input type="file" id="cf-file" accept="image/*" class="vh"></div></div>'+
  '<div class="form-grid">'+inp('cf-name','Name',src.name,'e.g. Smiths Lake water through trees','wide')+
  '<label class="f" for="cf-brand"><span>Brand'+req+'</span><select id="cf-brand">'+optsel(S.groups.brand,src.brand)+'</select></label>'+
  '<label class="f" for="cf-cat"><span>Category'+req+'</span><select id="cf-cat">'+optsel(S.tax.category,src.category)+'</select></label>'+
  blk('shot',src.shot)+blk('orient',src.orient)+blk('topics',src.topics)+blk('privacy',src.privacy)+blk('mood',src.mood)+blk('audio',src.audio)+
  inp('cf-subject','Subject for the file name',src.subject,'smiths lake water')+
  '<label class="f" for="cf-filmed">Filmed on<input type="date" id="cf-filmed" value="'+esc(src.filmed||'')+'"></label>'+
  inp('cf-dur','Length',src.duration,'0:12')+inp('cf-loc','Place (optional)',src.location,'Smiths Lake')+
  inp('cf-tags','Extra tags (comma separated)',(src.tags||[]).join(', '),'axe throwing, halloween','wide')+
  '<div class="wide"><div class="g-title">Standard file name</div><div class="fname"><code id="cf-fname"></code><button type="button" class="btn" id="cf-fcopy">Copy</button></div><p class="meta" id="cf-fpath" style="margin-top:6px"></p></div>'+
  inp('cf-src','Where the file lives now',src.source,'Shorts B-roll Library > Estus > Calm and nature > file name','wide')+
  '<label class="f wide" for="cf-notes">Notes<textarea id="cf-notes" rows="2" placeholder="What this shot is good for, what needs blurring">'+esc(src.notes||'')+'</textarea></label></div>'+
  '<p class="missing" id="cf-miss" role="status"></p><p class="err" id="cf-err" role="alert"></p><div class="modal-a" id="cf-actions">'+(c?'<button type="button" class="btn danger" id="cf-del">Delete clip</button>':'')+'<span class="grow"></span><button type="button" class="btn ghost" id="cf-cancel">Cancel</button><button type="button" class="btn primary" id="cf-save">Save clip</button></div>';
  openModal(html,function(m){
    var err=m.querySelector('#cf-err');
    var val=function(s){return m.querySelector(s).value.trim()};
    m.querySelector('#cf-name').setAttribute('data-focus','');
    function readForm(){
      var d={name:val('#cf-name'),brand:m.querySelector('#cf-brand').value,category:m.querySelector('#cf-cat').value,subject:slug(val('#cf-subject')),filmed:val('#cf-filmed'),duration:val('#cf-dur'),location:val('#cf-loc'),tags:val('#cf-tags').split(',').map(function(x){return x.trim()}).filter(Boolean),source:val('#cf-src'),notes:val('#cf-notes')};
      ['shot','orient','mood','audio','privacy'].forEach(function(k){var b=m.querySelector('[data-tk="'+k+'"] [aria-pressed="true"]');d[k]=b?b.dataset.tv:''});
      d.topics=Array.prototype.map.call(m.querySelectorAll('[data-tk="topics"] [aria-pressed="true"]'),function(b){return b.dataset.tv});
      return d;
    }
    function update(){
      var d=readForm(), ms=missing(Object.assign({},d,{img:(pending||(c&&c.img))?'y':''}));
      m.querySelector('#cf-fname').textContent=fileName(d);
      m.querySelector('#cf-fpath').textContent='Folder: '+drivePath(d);
      var mi=m.querySelector('#cf-miss');mi.textContent=ms.length?'Still needed: '+ms.join(', ')+'.':'All required fields done.';mi.style.color=ms.length?'':'var(--ok)';
      ['shot','orient','mood','audio','privacy'].forEach(function(k){var x=T(k,d[k]);m.querySelector('[data-det="'+k+'"]').textContent=x?x.detail:''});
    }
    m.addEventListener('click',function(e){
      var b=e.target.closest('[data-tv]');if(!b)return;var row=b.parentNode,was=b.getAttribute('aria-pressed')==='true';
      if(!row.dataset.multi)row.querySelectorAll('[data-tv]').forEach(function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed',was?'false':'true');update();
    });
    m.addEventListener('input',update);m.addEventListener('change',update);
    m.querySelector('#cf-guide').addEventListener('click',closeModal);
    m.querySelector('#cf-fcopy').onclick=function(e){copyText(m.querySelector('#cf-fname').textContent,e.currentTarget)};
    function setImg(file){
      if(!file||!/^image\//.test(file.type||'')){err.textContent='That file is not an image. Try a PNG or JPG screenshot.';return}
      loadImage(file).then(function(r){if(pending)URL.revokeObjectURL(pending.url);pending=r;m.querySelector('#dropPrev').innerHTML='<span class="th"><img src="'+r.url+'" alt="Preview of the screenshot"></span>';err.textContent='';update()}).catch(function(e){err.textContent=e.message});
    }
    m.querySelector('#cf-file').addEventListener('change',function(e){setImg(e.target.files[0])});
    var drop=m.querySelector('#drop');
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',function(){drop.classList.remove('over')});
    drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('over');setImg(e.dataTransfer.files[0])});
    var onPaste=function(e){var items=(e.clipboardData&&e.clipboardData.items)||[];for(var i=0;i<items.length;i++){if(items[i].kind==='file'&&/^image\//.test(items[i].type)){e.preventDefault();setImg(items[i].getAsFile());return}}};
    document.addEventListener('paste',onPaste);modalCleanup.push(function(){document.removeEventListener('paste',onPaste)});
    m.querySelector('#cf-cancel').onclick=closeModal;
    m.querySelector('#cf-save').onclick=function(ev){
      var d=readForm();
      if(!d.name){err.textContent='Give the clip a name so you can find it later.';m.querySelector('#cf-name').focus();return}
      d.subject=d.subject||slug(d.name);d.example=false;
      var btn=ev.currentTarget;btn.disabled=true;btn.textContent='Saving';
      var step=pending?storeImage(pending.img).then(function(st){var old=c&&c.assetId;d.img=st.url;d.assetId=st.id||null;if(old&&assetsApi&&old!==d.assetId)assetsApi.delete(old).catch(function(){})}):Promise.resolve();
      step.then(function(){
        var target;if(c){Object.assign(c,d);target=c}else{target=Object.assign({id:'c'+uid()},d);S.broll.unshift(target)}
        var ms=missing(target);closeModal();render();save();
        toast(ms.length?'Saved. Still needs: '+ms.join(', ')+'.':'Clip saved and fully tagged.');
      }).catch(function(e){err.textContent='The screenshot did not upload ('+((e&&e.message)||e)+'). Try a smaller image.';btn.disabled=false;btn.textContent='Save clip'});
    };
    var del=m.querySelector('#cf-del');
    if(del)del.onclick=function(){
      var a=m.querySelector('#cf-actions');
      a.innerHTML='<span class="grow">Delete this clip from the library? The file in Drive stays. Recipes that use it will drop it.</span><button type="button" class="btn ghost" id="cf-keep">Keep it</button><button type="button" class="btn danger" id="cf-yes">Delete</button>';
      a.querySelector('#cf-keep').onclick=function(){openClipModal(id)};
      a.querySelector('#cf-yes').onclick=function(){
        S.broll=S.broll.filter(function(x){return x.id!==id});
        draft.broll=(draft.broll||[]).filter(function(x){return x!==id});
        S.recipes.forEach(function(r){if(r.sel&&r.sel.broll)r.sel.broll=r.sel.broll.filter(function(x){return x!==id})});
        if(c.assetId&&assetsApi)assetsApi.delete(c.assetId).catch(function(){});
        closeModal();render();save();toast('Clip deleted');
      };
      a.querySelector('#cf-keep').focus();
    };
    update();
  });
}
function openRecipeModal(){
  var sug=[labelOf('format',draft.format),labelOf('topic',draft.topic)].filter(Boolean).join(': ')||'My recipe';
  openModal('<h2>Save as recipe</h2><p class="sub">Keeps every choice on the Build tab, including the B-roll picks, so you can load it next time.</p><label class="f" for="rn">Recipe name<input id="rn" data-focus value="'+esc(sug)+'"></label><p class="err" id="rn-err" role="alert"></p><div class="modal-a"><span class="grow"></span><button type="button" class="btn ghost" id="rn-cancel">Cancel</button><button type="button" class="btn primary" id="rn-save">Save recipe</button></div>',function(m){
    m.querySelector('#rn-cancel').onclick=closeModal;
    var go=function(){var n=m.querySelector('#rn').value.trim();if(!n){m.querySelector('#rn-err').textContent='Give the recipe a name.';return}S.recipes.unshift({id:'r'+uid(),name:n,sel:clone(draft)});closeModal();render();save();toast('Recipe saved')};
    m.querySelector('#rn-save').onclick=go;m.querySelector('#rn').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  });
}
function openExport(){
  openModal('<h2>Export JSON</h2><p class="sub">Your lists, rules, clips and recipes. Copy it somewhere safe.</p><textarea class="json" id="ex" readonly aria-label="Exported JSON">'+esc(JSON.stringify(S,null,2))+'</textarea><div class="modal-a"><span class="grow"></span><button type="button" class="btn ghost" id="ex-close">Close</button><button type="button" class="btn primary" id="ex-copy">Copy JSON</button></div>',function(m){
    m.querySelector('#ex-close').onclick=closeModal;
    m.querySelector('#ex-copy').onclick=function(e){var b=e.currentTarget,ta=m.querySelector('#ex');navigator.clipboard.writeText(ta.value).then(function(){b.textContent='Copied'}).catch(function(){ta.focus();ta.select();toast('Copy was blocked. The text is selected, so copy it by hand.')})};
  });
}
function openImport(){
  openModal('<h2>Import JSON</h2><p class="sub">Paste a backup from Export JSON. It replaces everything on this page.</p><textarea class="json" id="im" aria-label="JSON to import" placeholder="Paste JSON here"></textarea><p class="err" id="im-err" role="alert"></p><div class="modal-a"><span class="grow"></span><button type="button" class="btn ghost" id="im-cancel">Cancel</button><button type="button" class="btn primary" id="im-go">Replace with this</button></div>',function(m){
    m.querySelector('#im-cancel').onclick=closeModal;
    m.querySelector('#im-go').onclick=function(){var s;try{s=JSON.parse(m.querySelector('#im').value)}catch(e){m.querySelector('#im-err').textContent='That is not valid JSON. Paste the whole export, from the first { to the last }.';return}
      if(!valid(s)){m.querySelector('#im-err').textContent='This JSON is missing groups, broll or recipes, so it is not an export from this page.';return}
      S=normalise(s);dirty=false;closeModal();render();save();toast('Imported');};
  });
}

/* ---------- actions ---------- */
function copyPrompt(btn){
  var txt=buildPrompt(draft);
  var done=function(){var t=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=t},1600)};
  var fail=function(){var pre=document.getElementById('prompt');if(pre){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);pre.scrollIntoView({block:'center'})}toast('Copy was blocked. The prompt is selected, so press and hold to copy it.')};
  try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
}
function loadRecipe(id){
  var r=S.recipes.filter(function(x){return x.id===id})[0];if(!r)return;
  draft=Object.assign(blankDraft(),clone(r.sel));saveDraft();
  if(tab()!=='build')location.hash='build';else render();
  toast('Loaded "'+r.name+'"');
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act, id=t.dataset.id;
  if(act==='chip'){var g=GMAP[t.dataset.g];if(g.multi){var arr=draft[g.key]||[],i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);draft[g.key]=arr}else draft[g.key]=draft[g.key]===id?'':id;saveDraft();refreshGroup(g.key,id);updatePrompt()}
  else if(act==='pick'){var pc=clipById(id);if(pc&&!canUse(pc)&&(draft.broll||[]).indexOf(id)<0){toast('This clip is marked internal only, so it cannot go in a short.');return}var a=draft.broll||[],k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);draft.broll=a;saveDraft();refreshBroll();updatePrompt()}
  else if(act==='up'||act==='down'){var b=draft.broll,j=b.indexOf(id),n=j+(act==='up'?-1:1);if(j<0||n<0||n>=b.length)return;b.splice(j,1);b.splice(n,0,id);saveDraft();refreshBroll();updatePrompt();var nb=document.querySelector('#brollPicked [data-act="'+act+'"][data-id="'+id+'"]');if(nb&&!nb.disabled)nb.focus()}
  else if(act==='copy')copyPrompt(t);
  else if(act==='see-prompt'){var o=document.getElementById('out');if(o)o.scrollIntoView({block:'start'})}
  else if(act==='save-recipe')openRecipeModal();
  else if(act==='clear'){draft=blankDraft();saveDraft();render();toast('Cleared. Load a recipe to start again.')}
  else if(act==='add-clip')openClipModal(null);
  else if(act==='edit-clip')openClipModal(id);
  else if(act==='load-recipe')loadRecipe(id);
  else if(act==='del-recipe'){var box=t.parentNode;box.innerHTML='<span>Delete this recipe?</span><button type="button" class="btn ghost" data-act="keep-recipe">Keep</button><button type="button" class="btn danger" data-act="del-recipe-yes" data-id="'+esc(id)+'">Delete</button>';box.querySelector('[data-act="keep-recipe"]').focus()}
  else if(act==='keep-recipe')render();
  else if(act==='del-recipe-yes'){S.recipes=S.recipes.filter(function(r){return r.id!==id});render();save();toast('Recipe deleted')}
  else if(act==='list-add'){var gk=t.dataset.g;listRef(gk).push(gk.indexOf('tax:')===0?{id:'new'+uid(),label:'New option',detail:'',fresh:true}:it(gk.slice(0,3)+uid(),'New option',''));openLists[gk]=true;markDirty();render()}
  else if(act==='list-del'){listRef(t.dataset.g).splice(+t.dataset.i,1);openLists[t.dataset.g]=true;markDirty();render()}
  else if(act==='lists-save'){fixFresh();dirty=false;var sb=document.getElementById('savebar');if(sb)sb.classList.remove('show');save();toast('Lists saved')}
  else if(act==='fb-copy')copyText(fileName(fb),t);
  else if(act==='export')openExport();
  else if(act==='import')openImport();
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.fb){fb[el.dataset.fb]=el.value;updateFb();return}
  if(el.dataset.field){draft[el.dataset.field]=el.value;saveDraft();updatePrompt();return}
  if(el.id==='brollSearch'){brollQ=el.value;document.getElementById('brollStrip').innerHTML=stripHTML();return}
  if(el.id==='libSearch'){libQ=el.value;document.getElementById('libGrid').innerHTML=gridHTML();return}
  if(el.dataset.lf){if(el.dataset.lf==='rules')S.rules=el.value;else{var row=listRef(el.dataset.lg)[+el.dataset.li];if(row)row[el.dataset.lf]=el.value}markDirty()}
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='recipeSel'&&el.value)loadRecipe(el.value);
  else if(el.id==='libCat'){libCat=el.value;document.getElementById('libGrid').innerHTML=gridHTML()}
  else if(el.id==='libTodo'){libTodo=el.value;document.getElementById('libGrid').innerHTML=gridHTML()}
  else if(el.id==='libBrand'){libBrand=el.value;document.getElementById('libGrid').innerHTML=gridHTML()}
});
app.addEventListener('toggle',function(e){var d=e.target;if(d&&d.tagName==='DETAILS'&&d.dataset.lg)openLists[d.dataset.lg]=d.open},true);
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

render();
connect();
})();
</script>
