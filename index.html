<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a slim ink masthead, then a file-explorer. Left: nested tree (folder > group > training). Right: whatever is selected.
   Every training lives in the HUB data in the script below. Each folder owns one Estus band colour. */
:root{
  --bg:#F3F2EF;--surface:#FBFAF8;--sunk:#ECEAE6;--fg:#0E1014;--muted:#65676E;--rule:#D3D1CC;--ink:#090909;--on-ink:#FBFAF8;--ink-muted:#AEB5C2;
  --navy:#344982;--blue:#2F6F9E;--teal:#2CA5B8;--plum:#AB5C95;--slate:#5B6170;
  --navy-t:#DDE2EF;--blue-t:#DCE8F1;--teal-t:#DAF0F3;--plum-t:#F1E1EC;--slate-t:#E4E5E8;
  --good:#2E7D4F;--good-t:#DDEFE3;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;--cond:"Barlow Semi Condensed","Arial Narrow",sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--fg:#ECEEF1;--muted:#9BA1AB;--rule:#2C323C;--ink:#05070A;--on-ink:#ECEEF1;--ink-muted:#9BA1AB;
  --navy:#8299DA;--blue:#6FA8D2;--teal:#4CC3D4;--plum:#D58FC1;--slate:#A3A9B6;
  --navy-t:#1E2740;--blue-t:#18293A;--teal-t:#123238;--plum-t:#33202E;--slate-t:#262A32;
  --good:#5FC38A;--good-t:#16301F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--fg:#ECEEF1;--muted:#9BA1AB;--rule:#2C323C;--ink:#05070A;--on-ink:#ECEEF1;--ink-muted:#9BA1AB;
  --navy:#8299DA;--blue:#6FA8D2;--teal:#4CC3D4;--plum:#D58FC1;--slate:#A3A9B6;
  --navy-t:#1E2740;--blue-t:#18293A;--teal-t:#123238;--plum-t:#33202E;--slate-t:#262A32;
  --good:#5FC38A;--good-t:#16301F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.c-teal{--c:var(--teal);--ct:var(--teal-t)}.c-blue{--c:var(--blue);--ct:var(--blue-t)}.c-navy{--c:var(--navy);--ct:var(--navy-t)}.c-plum{--c:var(--plum);--ct:var(--plum-t)}.c-slate{--c:var(--slate);--ct:var(--slate-t)}

/* masthead */
.mast{background:var(--ink);color:var(--on-ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;border-bottom:1px solid #22252B;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px}
.wordmark{font-family:var(--display);font-size:15px;letter-spacing:.16em;line-height:1}
.wordmark b{font-weight:700}.wordmark span{font-weight:500}
.bands{display:flex;width:132px;height:6px}.bands i{flex:1}
.bands i:nth-child(1){background:#344982}.bands i:nth-child(2){background:#2F6F9E}.bands i:nth-child(3){background:#2CA5B8}.bands i:nth-child(4){background:#AB5C95}
.tabs{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.tag{font:600 12px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
.hero{display:flex;justify-content:space-between;align-items:end;gap:24px 40px;flex-wrap:wrap;padding-block:24px 22px}
.hero h1{font:600 clamp(36px,6vw,56px)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:#2CA5B8}
.hero .lead{font-size:16px;color:#D6DAE2;margin-top:8px;max-width:56ch}
.prog{min-width:240px;flex:0 1 320px}
.prog-t{display:flex;justify-content:space-between;font:700 12px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.prog-t b{color:#FBFAF8;font:600 20px/1 var(--display);letter-spacing:.02em}
.bar{height:8px;background:#2C323C}.bar i{display:block;height:100%;background:#2CA5B8;width:0;transition:width .3s}

/* explorer */
.ex{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;padding-block:24px 48px;align-items:start}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule)}
.tools{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tools input,.tools select{font:500 15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--rule);padding:8px 10px;min-height:40px;border-radius:0}
.tools input{flex:1 1 140px;min-width:0}
.tools select{flex:0 0 auto}
.tree{overflow:auto;padding:6px 0 10px;flex:1}
.tree ul{list-style:none;margin:0;padding:0}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:7px 12px;min-height:38px;border-left:4px solid transparent}
.node:hover{background:var(--sunk)}
.node[aria-current="true"]{background:var(--ct);border-left-color:var(--c)}
.chev{flex:none;width:14px;height:14px;transition:transform .15s;color:var(--muted)}
[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.n-f{font:600 15px var(--cond);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.n-f .sw{flex:none;width:10px;height:10px;background:var(--c)}
.n-g{font:600 13px var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-left:30px}
.n-m{font:500 15px/1.25 var(--body);padding-left:36px}
.n-g+ul .n-m,.lvl3 .n-m{padding-left:52px}
.lbl{flex:1;min-width:0}
.cnt{flex:none;font:600 12px var(--cond);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.cnt.all{color:var(--good)}
.tick{flex:none;width:14px;height:14px;border:1.5px solid var(--rule);border-radius:50%;display:inline-grid;place-items:center;font-size:9px;line-height:1}
.tick.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.tick.na{border-style:dashed}
.num{flex:none;width:18px;font:600 15px var(--display);color:var(--c);font-variant-numeric:tabular-nums}
.none{padding:12px 16px;color:var(--muted);font-size:15px}

/* pane */
.pane{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--c);min-width:0}
.pane-in{padding:24px 28px 28px}
.crumb{font:600 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted)}
.crumb button:hover{color:var(--fg);text-decoration:underline}
.pane h2{font:600 clamp(28px,4vw,40px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:8px 0 10px}
.pane .blurb{color:var(--muted);max-width:60ch}
.pill{display:inline-block;font:700 11px var(--cond);text-transform:uppercase;letter-spacing:.12em;padding:3px 8px;background:var(--ct);color:var(--c)}
.code{font:600 13px var(--display);letter-spacing:.1em;color:var(--muted);margin-left:8px}
.d{font-size:17px;max-width:62ch}
.h-lbl{font:700 12px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.inside{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font:600 14px var(--cond);text-transform:uppercase;letter-spacing:.05em}
.inside li::before{content:"";display:inline-block;width:7px;height:7px;background:var(--c);margin-right:7px;transform:translateY(-2px)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--rule);padding:2px 8px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
.open{font:600 15px var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--on-ink);background:var(--ink);text-decoration:none;padding:10px 18px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.open:hover{background:var(--c)}
.done{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--rule);color:var(--muted);font:600 13px var(--cond);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:8px 14px;min-height:44px}
.done i{width:18px;height:18px;border:1.5px solid var(--muted);display:inline-grid;place-items:center;font-style:normal;font-size:12px}
.done[aria-pressed="true"]{color:var(--good);border-color:var(--good)}
.done[aria-pressed="true"] i{background:var(--good);border-color:var(--good);color:var(--surface)}
.hint{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* list inside a folder or group overview */
.grp{margin-top:22px}
.grp-h{display:flex;align-items:baseline;gap:10px;border-top:2px solid var(--c);padding-top:8px;margin-bottom:4px}
.grp-h h3{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.grp-h button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.grp-h button:hover{text-decoration:underline}
.grp-h span{font-size:14px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .pick{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.row .pick b{display:block;font:600 17px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.03em}
.row .pick span{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pick:hover b{text-decoration:underline;text-underline-offset:3px}
.row .go{font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);text-decoration:none;border:1px solid var(--rule);padding:6px 10px}
.row .go:hover{border-color:var(--c);color:var(--c)}
.row .num{font-size:22px;width:22px}
.sib{margin-top:24px}
.sib .rows .row{padding:7px 0}
.sib .row .pick b{font-size:15px}
.row .pick small.cnt{font:600 12px var(--cond);letter-spacing:.06em;text-transform:none;margin-left:6px}
.prow{grid-template-columns:auto minmax(0,1fr) auto}
.prow .pick{cursor:default}
.pacts{display:flex;gap:8px;align-items:center}
.pacts .done{min-height:34px;padding:5px 10px;font-size:12px}
.pacts .done i{width:15px;height:15px;font-size:10px}
@media (max-width:520px){.prow{grid-template-columns:auto minmax(0,1fr)}.pacts{grid-column:2}}

footer{border-top:1px solid var(--rule)}
footer .wrap{padding-block:24px 48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer .wordmark{color:var(--fg)}
.reset{background:none;border:1px solid var(--rule);color:var(--fg);font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;cursor:pointer}

/* phones and narrow tablets: one column, the detail opens inside the tree under the row you tapped */
@media (max-width:860px){
  .ex{grid-template-columns:1fr;padding-top:16px}
  .side{position:static;max-height:none}
  .tree{overflow:visible}
  .ex>.pane{display:none}
  .tree .pane{margin:2px 10px 10px;border-left:1px solid var(--rule)}
  .tree .pane-in{padding:16px}
  .tree .pane h2{font-size:26px}
  .prog{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.chev,.bar i{transition:none}}
</style>

<script src="theme.js"></script><script src="suite.js"></script></head><body><header class="mast">

<script>
/* ---------- The hub. Add a page: add it to M, then put its slug in a folder or group in HUB. ----------
   M[slug]: t title, h page, p pill, d description, i what's inside, w who it's for, r roles for the filter,
            k code (optional), x true for templates (no progress tick, drafts save locally). */
var EV='clinician lead ops marketing driving';
var M={
  culture:{t:'Estus Culture',h:'culture.html',p:'Start here',d:'What we believe, how we work, our rituals, supervision, who we see and how we lead.',i:['Beliefs','Rituals','Design your week'],w:['Everyone'],r:EV},
  playbook:{t:'Training Playbook',h:'playbook.html',p:'Interactive playbook',d:'The Estus Session, the correction and lock-in loop, and how we adjust the method for a neurodivergent team.',i:['5-phase session','Kind vs wicked','Trainer run-sheet'],w:['Everyone','Trainers'],r:EV},
  calendar:{t:'Calendar Management',h:'calendar.html',p:'Interactive tool',d:'Lifestyle first. The three Estus calendars, build order, transition prompts, and a weekly planner with a Today view.',i:['Three calendars','Transition prompts','Planner'],w:['Everyone'],r:EV},
  gm:{t:'GM Mode',h:'gm.html',p:'Interactive tool',d:'ACT for clinicians, run like a GM\'s front office. A 60-second reset, values turned into protected calendar blocks, and habits built as booked reps.',i:['60-second reset','Protected blocks','Rep tracker'],w:['Everyone'],r:EV},
  accelerator:{t:'Estus Accelerator',h:'accelerator.html',p:'Program',d:'The 2 to 3 year program: three phases, four leadership pathways, six specialisations and a board of advisors.',i:['Phases','Pathways','Progress tracker'],w:['Clinicians','Team leaders'],r:'clinician lead'},
  check:{t:'Clinician Check Card',h:'check.html',p:'Interactive tool',k:'EH-C2',d:'Run the fortnightly 1:1 live. Numbers check themselves against the thresholds, and a summary is ready to send.',i:['Live check','Thresholds','Why each check','Copy summary'],w:['Team leaders','Clinicians'],r:'lead clinician'},
  selfmastery:{t:'Self-Mastery Shelf',h:'self-mastery.html',p:'Book shelf',d:'Atomic Habits, Thinking in Bets, The 12 Levers, Situated, Discipline Is Destiny and Goggins, chapter by chapter. Every idea graded against the research and tied to our Stoic map.',i:['Chapter by chapter','Myth-buster','Daily loop','Goggins Lite'],w:['Everyone'],r:EV},

  journey:{t:'Client Journey Checklist',h:'journey.html',p:'Interactive tool',k:'EH-C1',d:'Track a client from referral to 12-month review, and learn why the route, goals and motivational interviewing are part of the therapy.',i:['Client tracker','Goals','MI practice','Continuity'],w:['Clinicians','Ops'],r:'clinician ops lead'},
  nurture:{t:'Nurture Trainer',h:'nurture.html',p:'Interactive trainer',d:'Form first, then the call. The emails and texts that get a new lead to the referral form and the booking, for online OT and driving.',i:['Lead and form sequences','Fill-once messages','Getting them to show','Practice'],w:['Clinicians','Ops','Driving OT'],r:'clinician ops driving'},
  welcome:{t:'Welcome Call Playbook',h:'welcome.html',p:'Interactive playbook',d:'Run the free 15 minute call with CLOSER, the Estus way. Fill once, then copy the right message for a client, a parent or a coordinator.',i:['CLOSER frame','Objection finder','Fill-once templates','Peer review scorecard'],w:['Clinicians'],r:'clinician'},

  neuroaffirming:{t:'Neuroaffirming Practice',h:'neuroaffirming.html',p:'The Estus way',d:'Autism, ADHD, PDA, dyspraxia and dyslexia, the ideas that reshaped how we see them, and how the Estus way shows up in every session, goal and report.',i:['Eight commitments','Do and don\'t','Frameworks in context','Language guide'],w:['Everyone'],r:EV},
  otmodels:{t:'OT Models and Frames',h:'ot-models.html',p:'Interactive map',d:'MOHO, CMOP-E, PEO and Kawa, six frames of reference and three process frameworks: when to reach for each, the evidence, and where the ideas came from.',i:['Model map','Source theories','Start from a question','Pairing guide'],w:['Clinicians','Driving OT'],r:'clinician driving'},
  assessments:{t:'Assessment Atlas',h:'assessments.html',p:'Interactive map',d:'40 assessments across 10 domains: what each measures, who fills it in, telehealth fit, and which of our report templates it feeds.',i:['Domain map','Report links','Finder by age','How we pick'],w:['Clinicians','Driving OT'],r:'clinician driving'},
  ef:{t:'Executive Function',h:'executive-function.html',p:'Interactive map',d:'Ten EF skills, the models behind them, and 34 supports in our order: environment, routine, tool, then skill.',i:['Skill map','Models in context','Supports finder','Neuroaffirming lens'],w:['Everyone'],r:EV},
  nervous:{t:'Nervous System',h:'nervous.html',p:'Interactive lab',d:'Accelerator and brake, the live body lab, the window of tolerance, interoception and co-regulation.',i:['Live lab','Body check-in','Regulation menu'],w:['Everyone','Parents'],r:EV},
  act:{t:'ACT',h:'act.html',p:'Approach',d:'Psychological flexibility for doing what matters. Defusion and values tools, done the neuroaffirming way.',i:['Six processes','Choice point','Tools','Game and quiz'],w:['Clinicians'],r:'clinician'},
  cbt:{t:'CBT',h:'cbt.html',p:'Approach',d:'The thought, feeling, body, action cycle. Thought record and exposure ladder tools, with neuroaffirming checks.',i:['Cycle','Thought record','Ladder'],w:['Clinicians','Driving OT'],r:'clinician driving'},
  beliefs:{t:'Core Beliefs',h:'beliefs.html',p:'Approach',d:'The deep stories under everyday thoughts, and the beliefs neurodivergent clients are often taught. Downward arrow, continuum and evidence log.',i:['Three layers','Taught beliefs','Tools','Practice'],w:['Clinicians'],r:'clinician'},
  mi:{t:'Motivational Interviewing',h:'mi.html',p:'Approach',d:'Spirit, OARS, change talk and the righting reflex. Readiness ruler and a 6-question practice.',i:['OARS','Readiness ruler','Practice'],w:['Clinicians','Ops'],r:'clinician ops'},
  gaming:{t:'Gaming-Informed Therapy',h:'gaming.html',p:'Approach',d:'How we use games and our Minecraft server for OT goals. Goal-to-game mapper, safety and teen moderators.',i:['Our server','Goal to game','Safety'],w:['Clinicians'],r:'clinician'},
  problemsolving:{t:'Problem Solving',h:'problem-solving.html',p:'Interactive lab',d:'18 plain-language thinking tools, from top down and bottom up to bottleneck, the region-beta paradox, Rule of 100 and task analysis.',i:['Bottleneck simulator','Task analysis and chaining','Rule of 100 tracker','Run your own problem'],w:['Everyone'],r:EV},

/* Suites (several pages that work as one training with tabs) come from suite.js.
   Each suite becomes one entry in M with its pages in "parts". The pages keep their own entries above. */
var PARENT={};
HUB_SUITES.forEach(function(s){
  var roles={};s.parts.forEach(function(p){PARENT[p[2]]=s.id;M[p[2]].r.split(' ').forEach(function(r){roles[r]=1})});
  M[s.id]={su:1,t:s.t,h:s.parts[0][0],p:s.p,d:s.d,i:s.i,w:s.w,r:Object.keys(roles).join(' '),parts:s.parts};
});

/* Folders. A folder has items (a flat list) or groups (each with items). "ordered" folders show step numbers.
   Items are page slugs or suite ids. Start here points at entries that also live in their home folder. */
var HUB=[
  {id:'start',n:'Start here',c:'teal',b:'Your first two weeks. Work through these in order: learn the method, then follow a client from first enquiry to review.',ordered:1,items:['culture','playbook','journey','leadflow','check','smallhinges']},
  {id:'runs',n:'How Estus runs',c:'teal',b:'How we work, how a client comes through Estus, and how you grow here.',groups:[
    {id:'ways',n:'How we work',b:'Culture, the training method, your week and your signature',items:['culture','playbook','week','signature']},
    {id:'clients',n:'Clients',b:'From first enquiry to the 12-month review',items:['leadflow','journey']},
    {id:'grow',n:'Growing here',b:'Your pathway, your 1:1 and your reading',items:['accelerator','check','selfmastery']}]},
  {id:'therapy',n:'Therapy',c:'navy',b:'The Estus way, the approaches we use, and the Small Hinges programs.',groups:[
    {id:'way',n:'The Estus way',b:'Foundations every clinician needs',items:['neuroaffirming','otmodels','assessments','efps','nervous']},
    {id:'approaches',n:'Programs and approaches',b:'What we run in sessions',items:['smallhinges','act','cbtbeliefs','mi','gaming','sportpsych']}]},
  {id:'growth',n:'Growth',c:'plum',b:'How Estus grows. Start with Growth HQ, then ads, content and referrers.',items:['growthhq','ads','content','gp']},
  {id:'templates',n:'Templates',c:'slate',b:'Builders for the reports we write and the handouts we give. Drafts save in your browser.',groups:[
    {id:'reports',n:'Reports',b:'For funders, schools and referrers',items:['fca','ptd','ftd','summary','sensory','letter']},
    {id:'handouts',n:'Handouts',b:'For clients, families and support teams',items:['goals','chaining','prompts','planner']}]}
];

(function(){
  var KEY='hub_done',OPEN='hub_open';
  function ls(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var done=ls(KEY,{}),open=ls(OPEN,{start:1}),sel='f-start',role='all',q='';
  try{role=localStorage.getItem('hub_role')||'all'}catch(e){}
  var tree=document.getElementById('tree'),pane=document.getElementById('pane'),narrow=window.matchMedia('(max-width:860px)');
  var TRACK=Object.keys(M).filter(function(s){return !M[s].x&&!M[s].su});

  /* lookups */
  var NODES={},HOME={};
  HUB.forEach(function(f){NODES['f-'+f.id]={f:f};
    (f.groups||[]).forEach(function(g){NODES['g-'+g.id]={f:f,g:g};g.items.forEach(function(s){HOME[s]={f:f,g:g}})});
    if(f.items&&f.id!=='start')f.items.forEach(function(s){HOME[s]={f:f}});
  });
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pages(s){return M[s].su?M[s].parts.map(function(p){return p[2]}):[s]}       // a suite counts as its pages
  function hay(s){var m=M[s];return (m.t+' '+m.d+' '+m.i.join(' ')+' '+m.p).toLowerCase()}
  function shows(s){var m=M[s];if(role!=='all'&&m.r.split(' ').indexOf(role)<0)return false;
    if(q){var all=[s].concat(m.su?pages(s):[]).map(hay).join(' ');return q.split(/\s+/).every(function(w){return all.indexOf(w)>-1})}return true}
  function vis(list){return list.filter(shows)}
  function allItems(f){return f.items?f.items:[].concat.apply([],f.groups.map(function(g){return g.items}))}
  function tracked(list){var out=[];list.forEach(function(s){pages(s).forEach(function(p){if(!M[p].x&&out.indexOf(p)<0)out.push(p)})});return out}
  function count(list){var t=tracked(list);if(!t.length)return '<span class="cnt">'+list.length+'</span>';
    var d=t.filter(function(s){return done[s]}).length;return '<span class="cnt'+(d===t.length?' all':'')+'">'+d+'/'+t.length+'</span>'}
  function isDone(s){var t=tracked([s]);return t.length&&t.every(function(p){return done[p]})}
  var CHEV='<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  function tick(s){if(M[s].x)return '<span class="tick na" aria-hidden="true"></span>';var on=isDone(s);return '<span class="tick'+(on?' on':'')+'" aria-hidden="true">'+(on?'✓':'')+'</span>'}
  function isOpen(id){return q?true:!!open[id]}

  /* tree */
  function modRow(s,f,n){return '<li><button class="node n-m c-'+f.c+'" data-sel="'+s+'"'+(sel===s?' aria-current="true"':'')+'>'+
    (n?'<span class="num">'+n+'</span>':tick(s))+'<span class="lbl">'+esc(M[s].t)+'</span>'+(M[s].su?count([s]):'')+(n&&!M[s].su?tick(s):'')+'</button>'+(sel===s?'<div data-slot></div>':'')+'</li>'}
  function drawTree(){
    var h='<ul>',any=false;
    HUB.forEach(function(f){
      var list=vis(allItems(f));if(!list.length)return;any=true;
      var fid='f-'+f.id,o=isOpen(f.id);
      h+='<li class="c-'+f.c+'"><button class="node n-f c-'+f.c+'" data-sel="'+fid+'" aria-expanded="'+o+'"'+(sel===fid?' aria-current="true"':'')+'>'+CHEV+'<span class="sw" aria-hidden="true"></span><span class="lbl">'+esc(f.n)+'</span>'+count(list)+'</button>';
      if(sel===fid)h+='<div data-slot></div>';
      if(o){h+='<ul>';
        if(f.items)vis(f.items).forEach(function(s){h+=modRow(s,f,f.ordered?f.items.indexOf(s)+1:0)});
        else f.groups.forEach(function(g){var gl=vis(g.items);if(!gl.length)return;var gid='g-'+g.id,go=isOpen(g.id);
          h+='<li><button class="node n-g c-'+f.c+'" data-sel="'+gid+'" aria-expanded="'+go+'"'+(sel===gid?' aria-current="true"':'')+'>'+CHEV+'<span class="lbl">'+esc(g.n)+'</span>'+count(gl)+'</button>';
          if(sel===gid)h+='<div data-slot></div>';
          if(go){h+='<ul class="lvl3">';gl.forEach(function(s){h+=modRow(s,f,0)});h+='</ul>'}
          h+='</li>'});
        h+='</ul>'}
      h+='</li>';
    });
    h+='</ul>';
    tree.innerHTML=any?h:'<p class="none">Nothing matches. Try another word or role.</p>';
  }

  /* pane */
  function doneBtn(s){if(M[s].x)return '<span class="hint">Drafts save in this browser</span>';
    var on=!!done[s];return '<button class="done" type="button" data-done="'+s+'" aria-pressed="'+on+'"><i aria-hidden="true">'+(on?'✓':'')+'</i>'+(on?'Done':'Mark done')+'</button>'}
  function row(s,n){var m=M[s];return '<li class="row">'+(n?'<span class="num">'+n+'</span>':tick(s))+
    '<button class="pick" data-sel="'+s+'"><b>'+esc(m.t)+(m.su?' <small class="cnt">'+m.parts.length+' pages</small>':'')+'</b><span>'+esc(m.d)+'</span></button><a class="go" href="'+m.h+'">Open</a></li>'}
  function partRow(p){var m=M[p[2]];return '<li class="row prow">'+tick(p[2])+
    '<div class="pick"><b>'+esc(p[1])+'</b><span>'+esc(m.d)+'</span></div><span class="pacts">'+doneBtn(p[2])+'<a class="go" href="'+p[0]+'">Open</a></span></li>'}
  function crumb(parts){return '<p class="crumb">'+parts.map(function(p){return p[1]?'<button data-sel="'+p[1]+'">'+esc(p[0])+'</button>':'<span>'+esc(p[0])+'</span>'}).join('<span aria-hidden="true">›</span>')+'</p>'}
  function drawPane(){
    var h='',c,f,g;
    if(M[sel]){var m=M[sel],home=HOME[sel];f=home.f;g=home.g;c=f.c;
      var cr=[[f.n,'f-'+f.id]];if(g)cr.push([g.n,'g-'+g.id]);
      h+=crumb(cr)+'<h2>'+esc(m.t)+'</h2><p style="margin-bottom:12px"><span class="pill">'+esc(m.p)+'</span>'+(m.k?'<span class="code">'+esc(m.k)+'</span>':'')+'</p>'+
        '<p class="d">'+esc(m.d)+'</p><p class="h-lbl">Inside</p><ul class="inside">'+m.i.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
        '<p class="h-lbl">For</p><div class="who">'+m.w.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>';
      if(m.su){
        h+='<div class="acts"><a class="open" href="'+m.h+'">Open training <span aria-hidden="true">&rarr;</span></a><span class="hint">'+m.parts.length+' pages, with tabs to move between them</span></div>'+
           '<p class="h-lbl">Pages in this training</p><ul class="rows">'+m.parts.map(partRow).join('')+'</ul>';
      }else{
        h+='<div class="acts"><a class="open" href="'+m.h+'">Open '+(m.x?'builder':'training')+' <span aria-hidden="true">&rarr;</span></a>'+doneBtn(sel)+'</div>';
      }
      var sibs=(g?g.items:f.items).filter(function(s){return s!==sel&&shows(s)});
      if(sibs.length&&!narrow.matches)h+='<div class="sib"><p class="h-lbl">Also in '+esc(g?g.n:f.n)+'</p><ul class="rows">'+sibs.map(function(s){return row(s)}).join('')+'</ul></div>';
    }else if(NODES[sel]){var nd=NODES[sel];f=nd.f;c=f.c;
      if(nd.g){g=nd.g;h+=crumb([[f.n,'f-'+f.id]])+'<h2>'+esc(g.n)+'</h2><p class="blurb">'+esc(g.b)+'</p><ul class="rows" style="margin-top:14px">'+vis(g.items).map(function(s){return row(s)}).join('')+'</ul>'}
      else{h+='<h2>'+esc(f.n)+'</h2><p class="blurb">'+esc(f.b)+'</p>';
        if(f.items)h+='<ul class="rows" style="margin-top:14px">'+vis(f.items).map(function(s){return row(s,f.ordered?f.items.indexOf(s)+1:0)}).join('')+'</ul>';
        else f.groups.forEach(function(gg){var gl=vis(gg.items);if(!gl.length)return;
          h+='<div class="grp"><div class="grp-h"><h3><button data-sel="g-'+gg.id+'">'+esc(gg.n)+'</button></h3><span>'+esc(gg.b)+'</span></div><ul class="rows">'+gl.map(function(s){return row(s)}).join('')+'</ul></div>'});
      }
      if(!vis(nd.g?nd.g.items:allItems(f)).length)h+='<p class="none" style="padding:14px 0 0">Nothing in here matches your search or role.</p>';
    }
    pane.className='pane c-'+(c||'teal');
    pane.innerHTML='<div class="pane-in">'+h+'</div>';
    /* phones: show the detail under the tapped row; folders and groups just open and close */
    var slot=tree.querySelector('[data-slot]');
    if(narrow.matches&&slot&&M[sel])slot.appendChild(pane);
    else if(pane.parentNode!==document.querySelector('.ex'))document.querySelector('.ex').appendChild(pane);
  }
  function progress(){var n=TRACK.filter(function(s){return done[s]}).length;
    document.getElementById('doneN').textContent=n;document.getElementById('totalN').textContent=TRACK.length;
    document.getElementById('barFill').style.width=(TRACK.length?n/TRACK.length*100:0)+'%'}
  function render(){drawTree();drawPane();progress()}

  function canon(id){return PARENT[id]||id}                                   // a suite page opens its suite
  function revealPath(id){var home=HOME[id]||NODES[id];if(!home)return;open[home.f.id]=1;if(home.g)open[home.g.id]=1}
  function select(id,fromTree){
    id=canon(id);var node=NODES[id];
    if(node&&fromTree){var key=node.g?node.g.id:node.f.id;
      if(!open[key]){open[key]=1}else if(sel===id||narrow.matches){delete open[key]}}
    if(M[id]&&fromTree&&narrow.matches&&sel===id){sel=''}else{sel=id}
    if(M[id]&&!fromTree)revealPath(id);
    put(OPEN,open);
    try{history.replaceState(null,'',sel?'#'+sel:location.pathname)}catch(e){}
    render();
    var b=tree.querySelector('[data-sel="'+(sel||id)+'"]');
    if(b&&fromTree)b.focus({preventScroll:true});
    if(b&&!fromTree){b.focus({preventScroll:true});if(narrow.matches)b.scrollIntoView({block:'start',behavior:'smooth'})}
    if(!fromTree&&!narrow.matches)pane.scrollIntoView({block:'nearest'});
  }

  document.addEventListener('click',function(e){
    var d=e.target.closest('[data-done]');
    if(d){var s=d.getAttribute('data-done');if(done[s])delete done[s];else done[s]=1;put(KEY,done);render();return}
    var t=e.target.closest('[data-sel]');
    if(t){select(t.getAttribute('data-sel'),!!t.closest('#tree')&&!t.closest('.pane'))}
  });
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render()});
  q=document.getElementById('q').value.trim().toLowerCase();
  var rs=document.getElementById('role');rs.value=role;
  rs.addEventListener('change',function(){role=rs.value;try{localStorage.setItem('hub_role',role)}catch(e){}render()});
  document.getElementById('resetDone').addEventListener('click',function(){done={};put(KEY,done);render()});
  window.addEventListener('pageshow',function(){done=ls(KEY,{});render()});
  window.addEventListener('storage',function(e){if(e.key===KEY){done=ls(KEY,{});render()}});
  (narrow.addEventListener?narrow.addEventListener('change',render):narrow.addListener(render));

  /* deep links: #slug (a suite page opens its suite), #suite, #f-folder, #g-group, plus the old #path, #shelf and #templates */
  var LEG={path:'f-start',shelf:'f-runs',templates:'f-templates','f-team':'f-runs','f-client':'g-clients','g-smallhinges':'smallhinges','g-plan':'f-growth','g-content':'content','g-admin':'signature'};
  function fromHash(){var h=decodeURIComponent(location.hash.slice(1));h=canon(LEG[h]||h);
    if(M[h]||NODES[h]){sel=h;if(M[h])revealPath(h);else{var nd=NODES[h];open[nd.f.id]=1;if(nd.g)open[nd.g.id]=1}}}
  fromHash();window.addEventListener('hashchange',function(){fromHash();render()});
  render();
})();
</script>
