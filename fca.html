<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FCA Builder</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23090909%22/%3E%3Crect x=%224%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%23344982%22/%3E%3Crect x=%2210%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%232F6F9E%22/%3E%3Crect x=%2216%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%232CA5B8%22/%3E%3Crect x=%2222%22 y=%2213%22 width=%226%22 height=%226%22 fill=%22%23AB5C95%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: ink masthead, then a quiet desk: a section index on the left and one section at a time on the right.
   Preview swaps the writing column for the A4 report. Checks open in a side drawer, so nothing nags while you write. */
:root{
  --bg:#F3F2EF;--surface:#FBFAF8;--sunk:#ECEAE6;--fg:#0E1014;--muted:#65676E;--rule:#D8D6D1;
  --ink:#090909;--on-ink:#FBFAF8;--ink-muted:#AEB5C2;--ink-rule:#34373D;
  --navy:#344982;--blue:#2F6F9E;--teal:#2CA5B8;--plum:#AB5C95;
  --navy-t:#DDE2EF;--teal-t:#DAF0F3;--plum-t:#F1E1EC;--good:#2E7D4F;--good-t:#DDEFE3;
  --on-accent:#071A1D;--desk:#E3E1DC;--scrim:rgba(9,9,9,.28);--shadow:rgba(9,9,9,.18);
  --paper:#FFFFFF;--paper-ink:#0E1014;--paper-muted:#65676E;--paper-rule:#D3D1CC;--paper-sunk:#F3F2EF;
  --paper-mast:#090909;--paper-on-mast:#FBFAF8;--paper-mast-muted:#AEB5C2;
  --paper-navy:#344982;--paper-teal:#2CA5B8;--paper-plum:#AB5C95;--paper-navy-t:#DDE2EF;--paper-plum-t:#F7E9F2;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--fg:#ECEEF1;--muted:#9BA1AB;--rule:#2C323C;
  --ink:#05070A;--on-ink:#ECEEF1;--ink-muted:#9BA1AB;--ink-rule:#2C323C;
  --navy:#8299DA;--blue:#6FA8D2;--teal:#4CC3D4;--plum:#D58FC1;
  --navy-t:#1E2740;--teal-t:#123238;--plum-t:#33202E;--good:#5FC38A;--good-t:#16301F;
  --on-accent:#05151A;--desk:#0B0E12;--scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#161A20;--sunk:#1D222A;--fg:#ECEEF1;--muted:#9BA1AB;--rule:#2C323C;
  --ink:#05070A;--on-ink:#ECEEF1;--ink-muted:#9BA1AB;--ink-rule:#2C323C;
  --navy:#8299DA;--blue:#6FA8D2;--teal:#4CC3D4;--plum:#D58FC1;
  --navy-t:#1E2740;--teal-t:#123238;--plum-t:#33202E;--good:#5FC38A;--good-t:#16301F;
  --on-accent:#05151A;--desk:#0B0E12;--scrim:rgba(0,0,0,.55);--shadow:rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
.app{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
button{font-family:inherit}

/* masthead */
.top{background:var(--ink);color:var(--on-ink);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.mark{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:5px;padding-right:16px;border-right:1px solid var(--ink-rule)}
.wm{font-family:var(--display);font-size:13px;letter-spacing:.16em;line-height:1}.wm b{font-weight:700}.wm span{font-weight:500}
.bands{display:flex;width:112px;height:5px}.bands i{flex:1}
.bands i:nth-child(1){background:#344982}.bands i:nth-child(2){background:#2F6F9E}.bands i:nth-child(3){background:#2CA5B8}.bands i:nth-child(4){background:#AB5C95}
.top h1{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1}
.who{font:600 11px var(--cond);letter-spacing:.16em;color:var(--ink-muted);text-transform:uppercase;margin-top:6px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;background:transparent;color:var(--on-ink);border:1px solid var(--ink-rule);cursor:pointer;line-height:1;display:inline-flex;gap:8px;align-items:center}
.tb:hover{border-color:var(--on-ink)}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink-rule)}
.mode button{font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;background:transparent;color:var(--on-ink);border:0;cursor:pointer;line-height:1}
.mode button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink)}
.cnt{font:700 12px var(--cond);min-width:20px;padding:2px 6px;text-align:center;background:var(--plum);color:#fff;line-height:1.2}
.cnt.ok{background:var(--good)}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border:1px solid var(--rule);min-width:250px;box-shadow:0 14px 34px -14px var(--shadow);z-index:30;display:flex;flex-direction:column;padding:6px}
.pop button{text-align:left;background:none;border:0;padding:10px 12px;font:500 14.5px var(--body);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.pop button small{font-size:12.5px;color:var(--muted)}
.pop button:hover{background:var(--sunk)}
.pop button:disabled{opacity:.45;cursor:not-allowed}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px 6px}
.pop .danger{color:var(--plum)}

/* desk */
.desk{display:grid;grid-template-columns:184px minmax(0,1fr);gap:52px;align-items:start}
.nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;padding-bottom:12px}
.nav .g{font:600 11px var(--cond);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:20px 0 6px 12px}
.nav .g:first-child{margin-top:4px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:5px 8px 5px 12px;font:500 14px var(--body);color:var(--muted);cursor:pointer;line-height:1.3}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{color:var(--fg);border-left-color:var(--teal);font-weight:600}
.nav .n{font:700 11px var(--cond);color:var(--plum);font-variant-numeric:tabular-nums}
.navsel{display:none}
.main{min-width:0;max-width:780px;display:flex;flex-direction:column;gap:30px}
.desk[data-mode="preview"] .main{max-width:none}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--plum-t);border-left:3px solid var(--plum);padding:10px 14px;font-size:14px}
.banner button{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:8px 12px;cursor:pointer}

.shead{display:flex;flex-direction:column;gap:6px}
.shead .eb{font:600 12px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.shead h2{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
.shead p{margin:0;color:var(--muted);max-width:62ch}

.form{display:flex;flex-direction:column;gap:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px}
.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.4}
input[type=text],input[type=date],select,textarea{width:100%;min-width:0;font:400 15px/1.5 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--rule);padding:9px 11px;border-radius:0}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 1px var(--teal)}
textarea{resize:none;overflow:hidden;min-height:78px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.sub{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:6px 0 -6px;color:var(--fg)}
.say{font-size:14px;color:var(--muted);background:var(--sunk);padding:10px 12px;line-height:1.45}
.say b{color:var(--fg);font-weight:600}

.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--teal);flex:none}
.tools{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.tool{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tool .grid2{padding-left:28px}

.area{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1px solid var(--rule)}
.area-head{display:flex;align-items:center;gap:10px}
.area-name{flex:1;min-width:0;font:500 18px var(--display)!important;letter-spacing:.04em;text-transform:uppercase;border:0!important;background:transparent!important;padding:2px 0!important;color:var(--fg)}
.area-name:focus{box-shadow:none!important;border-bottom:1px solid var(--teal)!important}
.x{background:none;border:0;color:var(--muted);font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:6px 2px;flex:none}
.x:hover{color:var(--plum)}
.pair{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.add{align-self:flex-start;background:none;border:1px dashed var(--muted);color:var(--fg);font:600 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;cursor:pointer}
.add:hover{border-style:solid}
.empty{padding:22px;border:1px dashed var(--rule);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--fg);max-width:100%}
.seg label{position:relative;cursor:pointer;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:7px 12px;font:600 12.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg label+label span{border-left:1px solid var(--fg)}
.seg input:checked+span{background:var(--fg);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--teal);outline-offset:-3px}
.grp-h{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.sup{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--rule)}
.sup .area-head{flex-wrap:wrap}
.sup .nm{flex:1;min-width:0;font:500 17px var(--display);letter-spacing:.04em;text-transform:uppercase}
.sup .nm small{display:block;font:600 11px var(--cond);letter-spacing:.14em;color:var(--muted)}
.calc{display:flex;flex-direction:column;gap:12px;background:var(--sunk);padding:14px}
.calc input{background:var(--surface)}
.out{font:500 14px var(--body);color:var(--fg);border-left:3px solid var(--teal);padding:2px 0 2px 10px;white-space:pre-line;font-variant-numeric:tabular-nums}
.out:empty::before{content:"Enter hours to see the line";color:var(--muted)}

.sgrid{overflow-x:auto}
.sgrid table{border-collapse:collapse;width:100%;min-width:420px}
.sgrid th{font:600 11.5px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px 6px;font-weight:600}
.sgrid td{padding:3px 6px 3px 0;vertical-align:middle}
.sgrid td:first-child{font:600 14px var(--cond);white-space:nowrap;padding-right:12px}
.sgrid input,.sgrid select{padding:6px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.auto{font:600 13px var(--cond);letter-spacing:.03em;color:var(--navy);white-space:nowrap}
.auto:empty::before{content:"\2013";color:var(--muted)}

.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:18px;flex-wrap:wrap}
.pager button{background:none;border:0;cursor:pointer;color:var(--fg);font:600 14px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;display:flex;flex-direction:column;gap:2px;text-align:left}
.pager button small{font:600 11px var(--cond);letter-spacing:.16em;color:var(--muted)}
.pager .nx{margin-left:auto;text-align:right;align-items:flex-end}
.pager button:hover span{color:var(--teal)}
.big{font:600 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;background:var(--teal);color:var(--on-accent);border:0;padding:12px 18px;cursor:pointer;align-self:flex-start}
.big:disabled{opacity:.5;cursor:not-allowed}
.done{display:flex;flex-direction:column;gap:12px}

/* checks drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--rule);z-index:40;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-18px 0 40px -24px var(--shadow)}
.drawer>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.drawer h3{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.drawer header p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.drawer .list{overflow:auto;padding:4px 20px 28px;display:flex;flex-direction:column}
.dg{font:600 11.5px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.ci{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;color:var(--fg);font:400 14.5px/1.4 var(--body);cursor:pointer}
.ci:hover{color:var(--teal)}
.ci .tg{flex:none;font:700 10.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;background:var(--plum-t);color:var(--plum)}
.ci .tg.w{background:var(--navy-t);color:var(--navy)}
.clear{padding:28px 0;color:var(--good);font:600 15px var(--cond);letter-spacing:.06em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;z-index:50;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--teal);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}

@media (max-width:880px){
  .desk{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{display:none}
  .navsel{display:block}
  .pair,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .shead h2{font-size:25px}
}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.tool .grid2{padding-left:0}.top h1{font-size:18px}}
</style>
<style id="sheetcss">
.paper{background:var(--desk);padding:24px;min-width:0}
.sheet{max-width:840px;margin:0 auto;background:var(--paper);color:var(--paper-ink);font-family:var(--body);font-size:14px;line-height:1.55;box-shadow:0 1px 2px rgba(9,9,9,.12),0 18px 40px -20px rgba(9,9,9,.45)}
.mast{background:var(--paper-mast);color:var(--paper-on-mast);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:24px 40px 18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mast h2{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.05em;text-transform:uppercase;margin:0;line-height:1.1}
.mast .ms{font:600 10.5px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--paper-mast-muted);margin-top:8px;max-width:52ch;line-height:1.5}
.mast .mk{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sheet .wm{font-size:14px}
.sheet .bands{width:124px;height:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc{padding:22px 40px 34px}
.doc .rh{font-family:var(--display);font-weight:600;font-size:16.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-navy);border-bottom:2px solid var(--paper-ink);padding-bottom:4px;margin:28px 0 12px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.doc .rh button{background:none;border:0;cursor:pointer;font:600 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted);padding:0}
.doc .rh button:hover{color:var(--paper-plum)}
.doc>p,.doc>ul{max-width:76ch}
.doc p{margin:0 0 9px}
.doc h4{font:700 12.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--paper-navy);margin:16px 0 6px}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:4px}
.tw{overflow-x:auto;margin:6px 0 16px}
.rt{width:100%;border-collapse:collapse;border-top:2px solid var(--paper-ink);border-bottom:2px solid var(--paper-ink);font-size:13.5px;min-width:520px}
.rt th{background:var(--paper-navy-t);color:var(--paper-navy);font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:7px 10px;border-bottom:1px solid var(--paper-rule);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt td{padding:8px 10px;border-bottom:1px solid var(--paper-rule);vertical-align:top}
.rt td+td,.rt th+th{border-left:1px solid var(--paper-rule)}
.rt td.lab{background:var(--paper-sunk);font:700 12.5px var(--cond);letter-spacing:.03em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt td.lab p{margin:0}
.rt tr.grp td{background:var(--paper-mast);color:var(--paper-on-mast);font:600 12.5px var(--display);letter-spacing:.14em;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt td p{margin:0 0 6px}.rt td p:last-child{margin:0}
.rt td ul{margin:0;padding-left:16px}
.rt td li{margin-bottom:3px}
.rt.num td{font-variant-numeric:tabular-nums}
.gap{display:inline-block;font:600 11.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-plum);background:var(--paper-plum-t);border-bottom:1.5px dashed var(--paper-plum);padding:1px 6px;line-height:1.4}
.sign{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.sign .sp{height:38px}
.sfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 40px 24px;border-top:1px solid var(--paper-rule)}
.sfoot small{font:600 10.5px var(--cond);letter-spacing:.12em;color:var(--paper-muted);text-transform:uppercase}
@media (max-width:640px){.paper{padding:10px}.mast,.doc,.sfoot{padding-left:18px;padding-right:18px}.mast .mk{align-items:flex-start}}
</style>

</head><body>
<div class="app">

/* ---------- report structure (follows Nik's FCA, Oct 2026) ---------- */
const DOMAINS=[
 {id:"adl",nav:"Self-care",title:"Self-Care (Activities of Daily Living)",rows:["Personal Hygiene (Bathing & Grooming)","Dressing","Eating & Mealtimes","Toileting & Continence","Medication Management","Sleep & Rest"]},

function aasp(i,v){if(str(v)==="")return"";const n=num(v),c=AASP[i];if(!c)return"";
  return n<=c[0]?"Much less than most people":n<=c[1]?"Less than most people":n<=c[2]?"Similar to most people":n<=c[3]?"More than most people":"Much more than most people"}
const TOOLS={
 whodas:{name:"World Health Organisation Disability Assessment Schedule 2.0 (WHODAS 2.0)",short:"WHODAS 2.0",
  about:"The WHODAS 2.0 is a World Health Organisation measure of functioning and disability across six domains: Cognition, Mobility, Self-Care, Getting Along, Life Activities and Participation. Scores range from 0 (no difficulty) to 100 (extreme difficulty) and can be compared with the general population.",
  rows:["Overall","Cognition","Mobility","Self-Care","Getting Along","Life Activities","Participation"],
  cols:[{k:"s",h:"Score (0 to 100)"},{k:"p",h:"Percentile"},{k:"d",h:"Descriptor",opts:["None","Mild","Moderate","Severe","Extreme"]}],

 brown:{name:"Brown Executive Function/Attention Scales (Brown EF/A)",short:"Brown EF/A",
  about:"The Brown EF/A Scales are a standardised rating scale of executive function and attention in daily life, reporting a Total Composite and six clusters: Activation, Focus, Effort, Emotion, Memory and Action. T-scores of 60 or above indicate that difficulties are more frequent or severe than expected for the person's age.",
  rows:["Activation","Focus","Effort","Emotion","Memory","Action","Total Composite"],
  cols:[{k:"r",h:"Raw"},{k:"t",h:"T-score"},{k:"p",h:"Percentile"},{k:"ci",h:"90% CI"},{k:"d",h:"Descriptor",auto:v=>band(v.t,[[70,"Markedly atypical"],[60,"Moderately atypical"],[55,"Somewhat atypical"],[0,"Typical"]])}],

 aasp:{name:"Adolescent/Adult Sensory Profile",short:"Sensory Profile",
  about:"The Adolescent/Adult Sensory Profile is a self-report questionnaire of how a person responds to everyday sensory experiences. It reports four quadrants (Low Registration, Sensation Seeking, Sensory Sensitivity and Sensation Avoiding), each compared with most people of the same age.",
  rows:["Low Registration","Sensation Seeking","Sensory Sensitivity","Sensation Avoiding"],
  cols:[{k:"r",h:"Raw score (/75)"},{k:"d",h:"Classification",auto:(v,i)=>aasp(i,v.r)}],

 gad7:{name:"Generalised Anxiety Disorder Assessment (GAD-7)",short:"GAD-7",

  rows:["Self-report","Informant"],
  cols:[{k:"s",h:"Score (/21)"},{k:"d",h:"Severity",auto:v=>band(v.s,[[15,"Severe"],[10,"Moderate"],[5,"Mild"],[0,"Minimal"]])}]},
 phq9:{name:"Patient Health Questionnaire (PHQ-9)",short:"PHQ-9",
  about:"The PHQ-9 is a 9-item screening measure of the severity of depressive symptoms over the past two weeks. Scores of 5, 10, 15 and 20 mark mild, moderate, moderately severe and severe depression, and item 9 screens for thoughts of death or self-harm.",
  rows:["Self-report","Informant"],
  cols:[{k:"s",h:"Score (/27)"},{k:"i9",h:"Item 9"},{k:"d",h:"Severity",auto:v=>band(v.s,[[20,"Severe"],[15,"Moderately severe"],[10,"Moderate"],[5,"Mild"],[0,"Minimal"]])}]},
 lsp16:{name:"Abbreviated Life Skills Profile (LSP-16)",short:"LSP-16",
  about:"The Abbreviated Life Skills Profile (LSP-16) is a 16-item clinician-rated measure of everyday functioning across four areas: Withdrawal, Self-Care, Compliance and Anti-Social behaviour. Higher scores indicate greater difficulty.",
  rows:["Total","Withdrawal","(Lack of) Self-Care","(Lack of) Compliance","Anti-Social"],
  cols:[{k:"r",h:"Raw"},{k:"a",h:"Average (0 to 3)"},{k:"d",h:"Descriptor",opts:["Minimal","Mild","Moderate","Severe"]}],
  note:"Take the descriptor from your scoring output."},
 zarit:{name:"Carer Burden Scale (Zarit Burden Interview)",short:"Carer Burden",
  about:"The Carer Burden Scale (Zarit Burden Interview) is a 22-item self-report measure of the emotional, physical and social impact of caring. Scores range from 0 to 88, and higher scores indicate greater burden (41 to 60 is moderate to severe, 61 and above is severe).",
  rows:["Total"],
  cols:[{k:"s",h:"Score (/88)"},{k:"d",h:"Burden",auto:v=>band(v.s,[[61,"Severe"],[41,"Moderate to severe"],[21,"Mild to moderate"],[0,"Little or no burden"]])}]}

const CRITERIA=[
 ["related","Related to the participant's disability","Name the disability, the limitations it causes, and the scores that show it. Every support should trace back to a need in this report."],

const STOCK={
 assess:"This assessment is based on a combination of clinical methods and a review of available documentation to form a holistic view of the participant's function.",

 L("Core","Consumables","amount"),

 L("Core","Assistance with Social, Economic and Community Participation","week",{w:{hrs:"",pattern:"",weeks:"52",rate:"",code:"04_104_0125_6_1",item:"Access Community Social and Rec Activ, Standard, Weekday"}}),

function example(){const s=blank();s.meta.example=true;
 Object.assign(s.client,{fullName:"Jordan (Jo) Sample",preferred:"Jo",pronouns:"she",dob:"2003-04-12",address:"1 Example Street, Fremantle WA 6160",ndis:"430 000 000",planReview:"2027-02-15"});
 Object.assign(s.assessor,{name:"Your Name",ahpra:"OCC0000000000",email:"you@estushealth.com"});
 Object.assign(s.dates,{from:"2026-10-05",to:"2026-10-16",report:"2026-10-20"});
 s.referral.reason="This Functional Capacity Assessment was requested by Pat Sample (parent and NDIS plan nominee) ahead of Jo's plan review on 15/02/2027. The last report is more than two years old and no longer reflects Jo's function, supports or goals.\nThis report reviews Jo's functional capacity in the context of Autism Spectrum Disorder, identifies current support needs, and makes recommendations to build Jo's independence at home, in the community and toward paid work.";
 const T=s.scores.tools;
 Object.assign(T.whodas,{on:true,by:"Pat Sample (proxy)",date:"2026-10-07",notes:"Completed by Pat as proxy. Life Activities (75) and Participation (72) were in the severe range, showing the greatest impact on household tasks, work and community participation."});
 [["61","97.0","Severe"],["50","93.0","Moderate"],["38","90.0","Moderate"],["45","92.0","Moderate"],["58","95.5","Moderate"],["75","98.0","Severe"],["72","98.5","Severe"]].forEach((r,i)=>T.whodas.vals[i]={s:r[0],p:r[1],d:r[2]});
 Object.assign(T.brown,{on:true,by:"Jo (self-report)",date:"2026-10-08",notes:"Elevated across most clusters, highest for Effort, which fits the difficulty Jo has sustaining effort on non-preferred tasks."});
 [62,58,66,60,63,61,64].forEach((t,i)=>T.brown.vals[i]={t:String(t)});
 Object.assign(T.gad7,{on:true,by:"Jo (self-report) and Pat Sample (informant)",date:"2026-10-09",notes:"Jo rated mild anxiety and Pat rated moderate anxiety, consistent with Jo underestimating the impact of anxiety on daily life."});
 T.gad7.vals[0]={s:"9"};T.gad7.vals[1]={s:"14"};
 Object.assign(T.zarit,{on:true,by:"Pat Sample",date:"2026-10-09",notes:""});T.zarit.vals[0]={s:"44"};
 s.scores.intro="Assessments were completed between 7 and 9 October 2026.";
 s.assessment.observations="Jo was observed across six telehealth OT sessions between 01/08/2026 and 30/09/2026, covering communication style, engagement, regulation and daily routines. The home environment was not observed in person.";
 s.assessment.interviews="Pat Sample (parent and plan nominee) was interviewed on 05/10/2026 for about 90 minutes. Jo joined part of each session and answered most questions directly.";
 s.assessment.docs="NDIS Plan, 15/02/2025 to 14/02/2027\nOccupational Therapy Progress Report, Example Therapy, 10/03/2026\nGP letter, 01/10/2026";
 s.goals.short="During the plan, I would like to cook three simple meals on my own each week.\nDuring the plan, I would like to catch the train to my volunteering shift with less support.\nDuring the plan, I would like to keep a regular sleep and wake time.";
 s.goals.long="During the plan, I would like to find part-time paid work in graphic design.\nDuring the plan, I would like to move into a shared house with support.";
 s.background.medical="Jo was diagnosed with Autism Spectrum Disorder in 2011. Jo's GP manages general health, and physical health is reported as good.";
 s.background.living="Jo lives with Pat and a younger sibling in a single-storey home in Fremantle and has not lived away from home.";
 s.routines.morning="Jo usually wakes after 10am and goes straight to her phone. She showers independently most days, but breakfast is often skipped unless Pat prompts it.";
 const A=s.domains.adl;
 A.summary="Jo completes basic self-care independently, but needs prompting for consistent grooming, meals and medication. This is due to ASD-related executive dysfunction (Brown EF/A Total T=64) and is reflected in the WHODAS 2.0 Self-Care domain (45, moderate).";
 A.rows[0].desc="Jo showers independently most days and needs no physical help. Teeth brushing and hair care are inconsistent, and Pat gives a verbal reminder before most appointments. Jo completes these tasks when prompted, so the gap is initiation, not skill (Brown EF/A Activation T=62).";
 A.rows[0].recs="Occupational Therapy: To build a visual grooming routine tied to showering, so tasks happen without prompts.\nSupport Worker: To practise the routine with low-demand prompts, fading as consistency builds.";
 A.rows[3].desc="Jo manages toileting independently, with no concerns reported.";A.rows[3].recs="Nil required.";
 A.rows[4].desc="Pat orders and sets out Jo's medication. Jo takes evening doses reliably but forgets morning doses about twice a week, and Pat says this is normal for Jo.";
 A.rows[4].recs="Occupational Therapy: To set up phone alarms linked to daily anchors, moving from Pat's set-up to Jo managing alone.";
 s.summary.text="Jo is a 23-year-old with Autism Spectrum Disorder. She is capable and articulate, with real strengths in design and cooking. However, ASD-related executive dysfunction and demand-related distress mean Jo cannot reliably start, plan or finish non-preferred tasks without prompting (WHODAS 2.0 overall 61, Brown EF/A Total T=64).";
 const sl=s.supports.lines;
 sl[1].why="Provides a Support Worker to practise grooming, meal and medication routines set by OT, so skills carry over into daily life (WHODAS Self-Care 45).";sl[1].w.hrs="3";sl[1].w.pattern="1 x 3-hour shift";

 s.criteria.related="Jo's functional limitations arise from Autism Spectrum Disorder, which causes executive dysfunction (Brown EF/A Total T=64), sensory avoidance and difficulty regulating distress, restricting participation (WHODAS 2.0 Overall 61, Participation 72).";
 s.risks.items="Carer breakdown, as Pat provides most prompting, planning and transport (Carer Burden 44/88).\nLoss of skills built in therapy, as Jo cannot yet maintain new routines without prompting.";

}

const KEY="estus-fca-builder-v1";

function deepMerge(base,inc){if(Array.isArray(base)||Array.isArray(inc))return inc!==undefined?inc:base;
  if(base&&typeof base==="object"&&inc&&typeof inc==="object"){const o=Object.assign({},base);for(const k in inc)o[k]=k in base?deepMerge(base[k],inc[k]):inc[k];return o}
  return inc===undefined?base:inc}
function normalise(x){const o=deepMerge(blank(),x||{});
  o.supports.lines=(o.supports.lines||[]).map(l=>deepMerge(L(l.cat||"Capacity",l.name||"","amount"),l));
  DOMAINS.forEach(d=>{if(!Array.isArray(o.domains[d.id].rows))o.domains[d.id].rows=[]});
  o.scores.custom=(o.scores.custom||[]).map(c=>Object.assign({id:uid(),name:"",about:"",by:"",date:"",table:"",notes:""},c));
  delete o.document;return o}

function supOut(l){
 if(l.mode==="nil")return["Nil"];
 if(l.mode==="amount")return items(l.amount);
 if(l.mode==="week"){const w=l.w,h=num(w.hrs),r=num(w.rate),wk=num(w.weeks)||52,o=[];

  const ci=[str(w.code),str(w.item)].filter(Boolean).join(" ");if(ci)o.push(ci);
  if(h&&r)o.push(`$${money(r)}/hr = $${money(h*r)}/week (~$${whole(h*r*wk)}/year at ${fmtN(wk)} weeks)`);
  return h?o:[]}
 if(l.mode==="year"){const y=l.y,parts=[];[[y.dir,y.dirL],[y.mdt,y.mdtL],[y.rep,y.repL],[y.oth,y.othL]].forEach(([v,lb])=>{const n=num(v);if(n)parts.push(`${fmtN(n)} hours${str(lb)?" "+str(lb):""}`)});
  if(!parts.length)return[];const tot=[y.dir,y.mdt,y.rep,y.oth].reduce((a,v)=>a+num(v),0);
  const o=[(parts.length>1?parts.join(" + ")+" = ":"")+fmtN(tot)+" hours per year"];const r=num(y.rate);
  if(r)o.push(`At $${money(r)}/hr: $${whole(tot*r)} per year`);return o}
 return[]}

const W=9638;
function bullet(text,o,ind){ind=ind||360;return P(R("\u2022",{color:"2CA5B8",b:true})+TAB+R(text,o||{}),`<w:tabs><w:tab w:val="left" w:pos="${ind}"/></w:tabs><w:spacing w:after="60"/><w:ind w:left="${ind}" w:hanging="${ind===360?280:240}"/>`)}
function cellX(c,label){if(!c.length)return P("",'<w:spacing w:after="0"/>');

  if(x.li!=null)return bullet(x.li,{sz:19},240);
  if(x.b!=null)return P(R(x.b,label?{font:COND,b:true,sz:19,color:"0E1014"}:{b:true,sz:19}),sp);
  if(x.gap!=null)return P(R("["+x.gap+"]",{hl:"yellow",sz:19}),sp);

function tc(w,fill,inner,span){return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${span>1?`<w:gridSpan w:val="${span}"/>`:""}${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:""}</w:tcPr>${inner}</w:tc>`}
function tblX(t){const n=t.w.length,ws=t.w.map(p=>Math.round(W*p/100));ws[n-1]=W-ws.slice(0,-1).reduce((a,b)=>a+b,0);
 let x=`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders><w:top w:val="single" w:sz="12" w:space="0" w:color="090909"/><w:bottom w:val="single" w:sz="12" w:space="0" w:color="090909"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="D3D1CC"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="D3D1CC"/></w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="50" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(v=>`<w:gridCol w:w="${v}"/>`).join("")}</w:tblGrid>`;
 if(t.head)x+=`<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>${t.head.map((h,i)=>tc(ws[i],"DDE2EF",P(R(h,{font:COND,b:true,caps:true,sz:16,sp:10,color:"344982"}),'<w:spacing w:after="0"/>'))).join("")}</w:tr>`;
 t.rows.forEach(r=>{
  if(r.kind==="group"){x+=`<w:tr><w:trPr><w:cantSplit/></w:trPr>${tc(W,"090909",P(R(r.text,{font:"Oswald",caps:true,sz:19,sp:24,color:"FBFAF8"}),'<w:keepNext/><w:spacing w:after="0"/>'),n)}</w:tr>`;return}
  let ci=0;x+="<w:tr>";r.cells.forEach((c,j)=>{const span=c.span||1,w=ws.slice(ci,ci+span).reduce((a,b)=>a+b,0);ci+=span;const lab=r.label&&j===0;x+=tc(w,lab?"F3F2EF":null,cellX(c.c,lab),span)});x+="</w:tr>"});
 return x+"</w:tbl>"+P("",'<w:spacing w:after="120"/>')}
function bandX(){const cols=["344982","2F6F9E","2CA5B8","AB5C95"],w=[2409,2409,2410,2410];
 return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${w.map(x=>`<w:gridCol w:w="${x}"/>`).join("")}</w:tblGrid><w:tr><w:trPr><w:trHeight w:val="90" w:hRule="exact"/></w:trPr>${cols.map((c,i)=>`<w:tc><w:tcPr><w:tcW w:w="${w[i]}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${c}"/></w:tcPr><w:p><w:pPr><w:spacing w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p></w:tc>`).join("")}</w:tr></w:tbl>`}
function makeDocx(){const B=build(),NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
 let body=P(R("Functional Capacity Assessment",{font:"Oswald",caps:true,sz:44,sp:10,color:"090909"}),'<w:spacing w:before="60" w:after="60"/>');
 body+=P(R("Confidential. Not to be released in part or in full without participant permission. Without prejudice.",{font:COND,b:true,caps:true,sz:16,sp:10,color:"65676E"}),'<w:spacing w:after="240"/>');
 B.forEach(b=>{
  if(b.t==="h")body+=P(R(b.text,{font:"Oswald",caps:true,sz:26,sp:10,color:"344982"}),'<w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="12" w:space="3" w:color="090909"/></w:pBdr><w:spacing w:before="360" w:after="160"/>');
  else if(b.t==="p")body+=P(R(b.text));
  else if(b.t==="gap")body+=P(R("["+b.text+"]",{hl:"yellow"}));
  else if(b.t==="lead")body+=P(R(b.label+":",{b:true})+(b.text?R(" "+b.text):""),b.text?"":'<w:keepNext/>');
  else if(b.t==="sub")body+=P(R(b.text,{font:COND,b:true,caps:true,sz:20,sp:10,color:"344982"}),'<w:keepNext/><w:spacing w:before="200" w:after="80"/>');
  else if(b.t==="ul")b.items.forEach(i=>body+=bullet(i));
  else if(b.t==="tbl")body+=tblX(b);
  else if(b.t==="sign"){const a=S.assessor;paras(S.signoff.closing).forEach(x=>body+=P(R(x),'<w:spacing w:before="240"/>'));
   body+=P(R("Kind regards,"),'<w:keepNext/><w:spacing w:before="200" w:after="600"/>');
   body+=P(str(a.name)?R(str(a.name),{b:true}):R("[Assessor name]",{hl:"yellow"}),'<w:keepNext/><w:spacing w:after="0"/>');
   body+=P(R((str(a.role)||"Occupational Therapist")+" | Estus Health"),'<w:keepNext/><w:spacing w:after="0"/>');
   if(str(a.email))body+=P(R("E: "+str(a.email)),'<w:keepNext/><w:spacing w:after="0"/>');
   body+=P(R("W: www.estushealth.com"),'<w:spacing w:after="0"/>')}
 });
 const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}<w:sectPr><w:headerReference w:type="default" r:id="rId2"/><w:footerReference w:type="default" r:id="rId3"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="510" w:gutter="0"/></w:sectPr></w:body></w:document>`;
 const hs={font:COND,b:true,caps:true,sz:15,color:"65676E",sp:12};
 const hdr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${NS}>${P(R("ESTUS ",{font:"Oswald",b:true,sp:40,sz:20})+R("HEALTH",{font:"Oswald",sp:40,sz:20})+TAB+R("hello@estushealth.com \u00B7 www.estushealth.com",hs),`<w:tabs><w:tab w:val="right" w:pos="${W}"/></w:tabs><w:spacing w:after="80"/>`)}${bandX()}${P("",'<w:spacing w:after="0"/>')}</w:hdr>`;
 const fld=i=>`<w:fldSimple w:instr=" ${i} ">${R("1",hs)}</w:fldSimple>`;
 const ftr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${NS}>${P(R((str(S.client.fullName)||"Client")+" | Functional Capacity Assessment",hs)+TAB+R("Page ",hs)+fld("PAGE")+R(" of ",hs)+fld("NUMPAGES"),`<w:pBdr><w:top w:val="single" w:sz="4" w:space="6" w:color="D3D1CC"/></w:pBdr><w:tabs><w:tab w:val="right" w:pos="${W}"/></w:tabs><w:spacing w:after="0"/>`)}</w:ftr>`;
 const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Barlow" w:hAnsi="Barlow" w:cs="Barlow" w:eastAsia="Barlow"/><w:color w:val="0E1014"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="288" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
 const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
 const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
 const drels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;
 const z=new JSZip();
 z.file("[Content_Types].xml",ct);z.file("_rels/.rels",rels);z.file("word/document.xml",doc);z.file("word/styles.xml",styles);
 z.file("word/header1.xml",hdr);z.file("word/footer1.xml",ftr);z.file("word/_rels/document.xml.rels",drels);
 return z.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
window.__fca={build,makeDocx,runChecks,get state(){return S},set state(v){S=normalise(v)}};

/* ---------- files ---------- */
let tt;function toast(m,undo){$("#toast-m").textContent=m;const u=$("#toast-u");u.hidden=!undo;UNDO=undo||null;$("#toast").hidden=false;clearTimeout(tt);tt=setTimeout(()=>{$("#toast").hidden=true;UNDO=null},undo?6000:2600)}
$("#toast-u").onclick=()=>{if(UNDO){UNDO();UNDO=null}$("#toast").hidden=true};
function fname(ext){const n=str(S.client.fullName).replace(/[^\w\s()-]/g,"").replace(/\s+/g," ").trim();return `FCA ${n||"Draft"}${S.dates.report?" "+S.dates.report:""}.${ext}`}
let DL=null;
function plainSave(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Saved "+name)}
async function saveFile(name,data){if(!DL){plainSave(name,data);return}
 try{const r=await DL.save({filename:name,data});if(r&&r.status==="saved")toast("Saved "+name)}
 catch(e){const c=e&&e.code;if(c==="declined")return;toast(c==="rate_limited"?"A save is already open":"Could not save the file ("+(c||"error")+")")}}
async function downloadDocx(){closeMenu();if(typeof JSZip==="undefined"){toast("Word export is still loading. Try again in a moment.");return}
 try{const blob=await makeDocx();await saveFile(fname("docx"),blob)}catch(e){toast("Could not build the Word file")}}
$("#dl-docx").onclick=downloadDocx;
$("#dl-json").onclick=()=>{closeMenu();const out=Object.assign({document:{type:"Functional Capacity Assessment",generatedBy:"Estus FCA Builder",generatedAt:new Date().toISOString(),schema:1}},clone(S));saveFile(fname("json"),JSON.stringify(out,null,2))};
$("#op-json").onclick=()=>{closeMenu();$("#openf").click()};
$("#openf").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const snap=clone(S);const d=JSON.parse(rd.result);S=normalise(d);S.meta.example=false;CUR="client";renderNav();setMode("write");runChecks();persist();toast("Opened "+f.name,()=>{S=snap;renderNav();setMode("write");runChecks();persist()})}
  catch(err){toast("That file is not a draft from this builder")}e.target.value=""};rd.readAsText(f)};
let armed=false;
function newReport(){const snap=clone(S);S=blank();CUR="client";closeMenu();renderNav();setMode("write");runChecks();persist();toast("New report started",()=>{S=snap;renderNav();setMode("write");runChecks();persist()})}
$("#new-rep").onclick=()=>{if(!armed){armed=true;$("#new-rep").querySelector("span").textContent="Click again to clear";return}armed=false;$("#new-rep").querySelector("span").textContent="Start a new report";newReport()};
function closeMenu(){$("#pop").hidden=true;$("#file-btn").setAttribute("aria-expanded","false");armed=false;$("#new-rep").querySelector("span").textContent="Start a new report"}
$("#file-btn").onclick=e=>{e.stopPropagation();const open=$("#pop").hidden;if(open){$("#pop").hidden=false;$("#file-btn").setAttribute("aria-expanded","true")}else closeMenu()};
document.addEventListener("click",e=>{if(!$("#pop").hidden&&!e.target.closest(".menu"))closeMenu()});
$("#m-write").onclick=()=>setMode("write");$("#m-prev").onclick=()=>setMode("preview");
function setDL(on){["dl-docx","dl-json"].forEach(id=>{$("#"+id).disabled=!on})}
setDL(true);
if(window.claude&&window.claude.use){setDL(false);(async()=>{try{DL=await window.claude.use("downloads")}catch(e){DL=null}setDL(!!DL)})()}

renderNav();runChecks();renderSection();
})();
</script>
